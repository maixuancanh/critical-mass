<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14291c"/>
      <stop offset="50%" stop-color="#09150e"/>
      <stop offset="100%" stop-color="#020804"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="corePlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#6ee7b7"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="poolGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="90" fill="url(#poolGlow)"/>

  <!-- Outer Heavy Hexagonal Shield -->
  <polygon points="100,12 176,55 176,145 100,188 24,145 24,55" fill="url(#armorGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.7"/>
  <polygon points="100,22 166,60 166,140 100,178 34,140 34,60" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- 6 Hexagon Rivet Bolts -->
  <circle cx="100" cy="18" r="3" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="170" cy="58" r="3" fill="#34d399"/>
  <circle cx="170" cy="142" r="3" fill="#34d399"/>
  <circle cx="100" cy="182" r="3" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="30" cy="142" r="3" fill="#34d399"/>
  <circle cx="30" cy="58" r="3" fill="#34d399"/>

  <!-- Orbital Ring 1 -->
  <ellipse cx="100" cy="100" rx="65" ry="24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(-30 100 100)"/>
  <circle cx="152" cy="70" r="3.5" fill="#a7f3d0" filter="url(#neonGlow)"/>

  <!-- Orbital Ring 2 -->
  <ellipse cx="100" cy="100" rx="65" ry="24" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(30 100 100)"/>
  <circle cx="48" cy="70" r="3.5" fill="#67e8f9" filter="url(#neonGlow)"/>

  <!-- Circular Reactor Core Iris -->
  <circle cx="100" cy="100" r="46" fill="#03150b" stroke="#10b981" stroke-width="2.5" filter="url(#neonGlow)"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Central Nuclear Trefoil Symbol -->
  <path d="M100 66 A34 34 0 0 1 126 81 L112 89 A18 18 0 0 0 100 82 Z" fill="url(#corePlasma)"/>
  <path d="M129 117 A34 34 0 0 1 100 134 L100 118 A18 18 0 0 0 115 109 Z" fill="url(#corePlasma)"/>
  <path d="M71 117 L85 109 A18 18 0 0 0 100 118 L100 134 A34 34 0 0 1 71 117 Z" fill="url(#corePlasma)"/>

  <!-- Center Plasma Nucleus -->
  <circle cx="100" cy="100" r="11" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="100" cy="100" r="6" fill="#10b981"/>

  <!-- Targeting Reticle Crosshairs -->
  <line x1="100" y1="46" x2="100" y2="54" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="100" y1="146" x2="100" y2="154" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="46" y1="100" x2="54" y2="100" stroke="#6ee7b7" stroke-width="1.5"/>
  <line x1="146" y1="100" x2="154" y2="100" stroke="#6ee7b7" stroke-width="1.5"/>
</svg>
